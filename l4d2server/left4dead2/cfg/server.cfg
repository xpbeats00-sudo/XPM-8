// XPM8 L4D2 dedicated server config

hostname "[2X] XP Mod 8 8v8"
rcon_password "ChangeThisRconPW2026!"
sv_password ""
sv_lan 0
sv_region 255
sv_contact "xpmodserver@gmail.com"

// --- Public visibility / discovery ---
sv_search_key xpmod
sv_tags xpmod
sv_steamgroup 1940128,1661587
sv_steamgroup_exclusive 0

// --- Player limit (requires L4DToolZ, installed in addons/l4dtoolz) ---
// L4DToolZ 2.2.0 only registers these two cvars (verified against its source)
sv_maxplayers 16
sv_visiblemaxplayers 16

// Unreserve the lobby so more than the normal 4/8 slots can actually join
sv_force_unreserved 1
// Direct-IP/localhost connect needs this at 0 - at 1, the engine rejects
// anything that didn't come through a Steam lobby (matchmaking/friend invite)
// with "The session is no longer available", which is what was blocking
// testing here. Set this back to 1 when the server is ready for public
// Steam server-browser/matchmaking visibility instead of direct-connect testing.
sv_allow_lobby_connect_only 0

// --- General ---
sv_alltalk 1
sv_voiceenable 1
sv_pausable 0
// Deliberately NOT sv_pure 2 / sv_consistency 1 - those force Steam-only
// files and would block every custom VPK this server relies on (Nightmare
// Collection cosmetics, XPMod's own addon content).
sv_consistency 0
mp_disable_autokick 1
sv_allow_wait_command 0
sv_forcepreload 1

// --- Networking tweaks (from SirPlease Competitive Rework, adapted) ---
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100
sm_cvar sv_client_min_interp_ratio -1
sm_cvar sv_client_max_interp_ratio 2
sm_cvar nb_update_frequency 0.014
sm_cvar net_splitpacket_maxrate 50000
sm_cvar fps_max 0

sm_cvar mp_timelimit 20
sm_cvar sv_timeout 120

// --- Logging ---
log on
sv_logecho 1
sv_logfile 1

// --- Remote console brute-force protection ---
sv_rcon_minfailures 3
sv_rcon_maxfailures 3
sv_rcon_banpenalty 720

// --- Game mode ---
// sv_gametypes is a whitelist - modes not listed here get silently rejected
// even if you try to force them via mp_gamemode.
sv_gametypes "coop,realism,survival,versus,scavenge"

// mp_gamemode cannot be set directly (engine rejects it as a plain cvar set).
// Use SourceMod's sm_cvar instead. NOTE: do NOT put "changelevel" in this file -
// server.cfg re-execs on every level load, so a changelevel command in here
// retriggers itself forever (confirmed: caused 80+ rapid reloads in testing).
sm_cvar mp_gamemode versus

// Versus normally force-shuts-down if there isn't a human on both teams
// (blocks solo testing / small-population play). This keeps the match
// running with bots filling empty human slots on either side.
sm_cvar sb_all_bot_game 1
